[package]
name = "tumorscript"
version = "0.1.0"
edition = "2021"
authors = ["TumorScript Team"]
description = "A biomorphic and entropic esoteric programming language runtime"

[[bin]]
name = "tumorscript"
path = "src_native/main.rs"

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
