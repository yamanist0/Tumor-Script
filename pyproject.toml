[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tumorscript"
version = "1.0.0"
description = "A biomorphic and entropic esoteric programming language runtime"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "TumorScript Contributors" }]
keywords = ["tumorscript", "esoteric", "biomorphic", "language", "interpreter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
    "Operating System :: OS Independent",
]

[project.scripts]
tumorscript = "tumorscript.cli:main"

[project.urls]
Homepage = "https://github.com/yamanist0/Tumor-Script"
Documentation = "https://github.com/yamanist0/Tumor-Script/wiki"
Repository = "https://github.com/yamanist0/Tumor-Script.git"
Issues = "https://github.com/yamanist0/Tumor-Script/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tumorscript*"]

[tool.setuptools.package-data]
tumorscript = ["*.lua", "src/*.lua", "bin/*"]
